spring.application.name=portal-academico
server.port=${PORT:8080}
# Atrás de proxy (Traefik/Vercel) o HTTPS termina antes da API; usa os headers X-Forwarded-*
server.forward-headers-strategy=framework

# Valores padrão são do docker-compose local; em produção vêm das variáveis de ambiente
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/portal_academico}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- OAuth2 login (exemplo com Google; troque pelo provedor real) ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
# Em produção o Google precisa voltar para o domínio do front (Vercel), que repassa para a API
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}

# Para onde o front-end (SPA) recebe o token depois do login
app.frontend.callback-url=${FRONTEND_CALLBACK_URL:http://localhost:5173/auth/callback}
# Origens liberadas no CORS (separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- JWT emitido pela própria API após o login OAuth2 ---
# Gere com: openssl rand -base64 32   (NUNCA hardcode isso em produção)
app.jwt.secret=${JWT_SECRET}
# Access token vive só em memória no front e dura pouco de propósito:
# se vazar (XSS, log, etc.) a janela de uso é curta.
app.jwt.expiracao-minutos=15
# Refresh token fica em cookie httpOnly, roda mais tempo, mas é revogável e rotacionado a cada uso.
app.jwt.refresh-expiracao-dias=30
# Tolerância (segundos) para duas requisições de refresh que chegam com o mesmo cookie quase ao
# mesmo tempo (F5 duplo, duas abas). Dentro dessa janela NÃO é tratado como token roubado.
app.jwt.refresh-tolerancia-segundos=20

# Deixe true sempre que servir por HTTPS (produção). Só use false rodando local em http puro.
app.cookie.secure=${COOKIE_SECURE:true}

# Não vazar stacktrace/detalhes internos em resposta de erro
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
spring.jpa.show-sql=false
