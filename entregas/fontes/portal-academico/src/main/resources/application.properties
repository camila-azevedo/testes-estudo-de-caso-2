spring.application.name=portal-academico
spring.datasource.url=jdbc:postgresql://localhost:5433/portal_academico
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- OAuth2 login (exemplo com Google; troque pelo provedor real) ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Para onde o front-end (SPA) recebe o token depois do login
app.frontend.callback-url=${FRONTEND_CALLBACK_URL:http://localhost:5173/auth/callback}

# --- JWT emitido pela própria API após o login OAuth2 ---
# Gere com: openssl rand -base64 32   (NUNCA hardcode isso em produção)
app.jwt.secret=${JWT_SECRET}
# Access token vive só em memória no front e dura pouco de propósito:
# se vazar (XSS, log, etc.) a janela de uso é curta.
app.jwt.expiracao-minutos=15
# Refresh token fica em cookie httpOnly, roda mais tempo, mas é revogável e rotacionado a cada uso.
app.jwt.refresh-expiracao-dias=30

# Deixe true sempre que servir por HTTPS (produção). Só use false rodando local em http puro.
app.cookie.secure=${COOKIE_SECURE:true}

# Não vazar stacktrace/detalhes internos em resposta de erro
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
spring.jpa.show-sql=false
